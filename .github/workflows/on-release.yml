name: on-release
on:
  push:
    tags:
      - v*

env:
  NX_BRANCH: ${{ github.event.number }}
  NX_RUN_GROUP: ${{ github.run_id }}
  NX_CLOUD_AUTH_TOKEN: ${{ secrets.NX_CLOUD_AUTH_TOKEN }}
  MOZ_HEADLESS: 1
  CONVENTIONAL_GITHUB_RELEASER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # install dependencies
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        id: cache
        with:
          path: node_modules
          key: node_modules-${{ hashFiles('**/package-lock.json') }}
      - run: npm ci
        if: steps.cache.outputs.cache-hit != 'true'

  # build ngx-bootstrap
  build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: node_modules
          key: node_modules-${{ hashFiles('**/package-lock.json') }}
      - uses: actions/cache@v5
        with:
          path: dist
          key: dist-${{ github.run_id }}
      - run: |
          npx nx build @iqualify/ngx-bootstrap --runner cloud --configuration production
          npx ng build --runner cloud --configuration production

  # publish to npm
  npm_publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: node_modules
          key: node_modules-${{ hashFiles('**/package-lock.json') }}
      - uses: actions/cache@v5
        with:
          path: dist
          key: dist-${{ github.run_id }}
      - run: npm publish dist/@iqualify/ngx-bootstrap --dry-run=true
        env:
          NPM_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}